# Valores por omissão para correr no anfitrião; em Docker e no Kubernetes vêm das variáveis de ambiente.
server:
  port: 9082

spring:
  application:
    name: bikeshop-stock
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:55433}/bikeshop_stock
    username: ${DB_USER:bikeshop}
    password: ${DB_PASSWORD:bikeshop}
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    open-in-view: false
  sql:
    init:
      mode: always
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USER:bikeshop}
    password: ${RABBITMQ_PASSWORD:bikeshop}
    listener:
      simple:
        default-requeue-rejected: false   # uma mensagem que falha não volta à fila em ciclo

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:9761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

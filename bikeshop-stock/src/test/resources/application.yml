# Testes: H2 em memória, sem Eureka, sem data.sql e sem ligar ao RabbitMQ
spring:
  application:
    name: bikeshop-stock
  datasource:
    url: jdbc:h2:mem:stock;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: never
  rabbitmq:
    listener:
      simple:
        auto-startup: false

eureka:
  client:
    enabled: false

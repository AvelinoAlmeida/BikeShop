# Testes: H2 em memória, sem Eureka e sem ligar ao RabbitMQ
spring:
  application:
    name: bikeshop-encomendas
  datasource:
    url: jdbc:h2:mem:encomendas;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: create-drop
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  # Como em produção: o Feign passa pelo circuit breaker (CatalogoIndisponivelTest)
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          bikeshop-catalogo:
            connect-timeout: 1000
            read-timeout: 2000

eureka:
  client:
    enabled: false

# Sem Jaeger nos testes
management:
  tracing:
    export:
      enabled: false

# Valores por omissão para correr no anfitrião; em Docker e no Kubernetes vêm das variáveis de ambiente.
server:
  port: 9085

spring:
  application:
    name: bikeshop-clientes
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:55436}/bikeshop_clientes
    username: ${DB_USER:bikeshop}
    password: ${DB_PASSWORD:bikeshop}
  jpa:
    hibernate:
      ddl-auto: update            # o Hibernate cria e atualiza as tabelas (slide 03)
    defer-datasource-initialization: true
    open-in-view: false
  sql:
    init:
      mode: always                # data.sql com os clientes de exemplo (só insere o que falta)

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:9761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  # Tracing: todos os pedidos são registados e enviados por OTLP para o Jaeger (bikeshop-jaeger)
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://${OTEL_HOST:localhost}:${OTEL_PORT:4319}/v1/traces
  # O Jaeger só recebe traces: as métricas não são exportadas
  otlp:
    metrics:
      export:
        enabled: false

# Testes: H2 em memória, sem Eureka e sem ligar ao RabbitMQ
spring:
  application:
    name: bikeshop-encomendas
  datasource:
    url: jdbc:h2:mem:encomendas;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: create-drop
  rabbitmq:
    listener:
      simple:
        auto-startup: false

eureka:
  client:
    enabled: false

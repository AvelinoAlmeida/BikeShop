# Valores por omissão para correr no anfitrião; em Docker e no Kubernetes vêm das variáveis de ambiente.
server:
  port: 9084

spring:
  application:
    name: bikeshop-encomendas
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:55435}/bikeshop_encomendas
    username: ${DB_USER:bikeshop}
    password: ${DB_PASSWORD:bikeshop}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USER:bikeshop}
    password: ${RABBITMQ_PASSWORD:bikeshop}
    listener:
      simple:
        default-requeue-rejected: false
  cloud:
    openfeign:
      # Cada chamada Feign passa pelo circuit breaker (configurado em EncomendasConfig)
      circuitbreaker:
        enabled: true
      client:
        config:
          bikeshop-catalogo:
            connect-timeout: 1000
            read-timeout: 2000

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:9761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

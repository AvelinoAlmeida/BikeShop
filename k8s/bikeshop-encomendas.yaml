# bikeshop-encomendas: Encomendas (orquestra a SAGA)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bikeshop-encomendas
  namespace: bikeshop
  labels:
    app: bikeshop-encomendas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bikeshop-encomendas
  template:
    metadata:
      labels:
        app: bikeshop-encomendas
    spec:
      containers:
        - name: bikeshop-encomendas
          image: bikeshop-encomendas:1.0
          imagePullPolicy: Never          # imagem carregada com minikube image load
          ports:
            - containerPort: 9084
          envFrom:
            - configMapRef:
                name: bikeshop-config
            - secretRef:
                name: bikeshop-secret
          env:
            - name: DB_PORT
              value: "55435"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75"
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 512Mi
          # O Spring demora a arrancar: a startupProbe dá até 5 minutos antes de a liveness contar
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9084
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9084
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9084
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: bikeshop-encomendas
  namespace: bikeshop
spec:
  type: ClusterIP
  selector:
    app: bikeshop-encomendas
  ports:
    - name: http
      port: 9084
      targetPort: 9084

# Valores por omissão para correr no anfitrião; em Docker e no Kubernetes vêm das variáveis de ambiente.
server:
  port: 9083

spring:
  application:
    name: bikeshop-pagamentos
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:55434}/bikeshop_pagamentos
    username: ${DB_USER:bikeshop}
    password: ${DB_PASSWORD:bikeshop}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USER:bikeshop}
    password: ${RABBITMQ_PASSWORD:bikeshop}
    listener:
      simple:
        # Quem recebe a mensagem continua o trace (o envio é observado no RabbitTemplate do MQConfig)
        observation-enabled: true
        default-requeue-rejected: false

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:9761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  # Tracing: todos os pedidos são registados e enviados por OTLP para o Jaeger (bikeshop-jaeger)
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://${OTEL_HOST:localhost}:${OTEL_PORT:4319}/v1/traces
  # O Jaeger só recebe traces: as métricas não são exportadas
  otlp:
    metrics:
      export:
        enabled: false

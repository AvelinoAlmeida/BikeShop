# bikeshop-catalogo: Catálogo de peças
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bikeshop-catalogo
  namespace: bikeshop
  labels:
    app: bikeshop-catalogo
spec:
  # Duas instâncias para ver o balanceamento da gateway e do Feign (slides 04 e 06):
  #   kubectl logs -n bikeshop -l app=bikeshop-catalogo --prefix | Select-String "respondeu a instância"
  replicas: 2
  selector:
    matchLabels:
      app: bikeshop-catalogo
  template:
    metadata:
      labels:
        app: bikeshop-catalogo
    spec:
      containers:
        - name: bikeshop-catalogo
          image: bikeshop-catalogo:1.0
          imagePullPolicy: Never          # imagem carregada com minikube image load
          ports:
            - containerPort: 9081
          envFrom:
            - configMapRef:
                name: bikeshop-config
            - secretRef:
                name: bikeshop-secret
          env:
            - name: DB_PORT
              value: "55432"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75"
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 512Mi
          # O Spring demora a arrancar: a startupProbe dá até 5 minutos antes de a liveness contar
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9081
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9081
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9081
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: bikeshop-catalogo
  namespace: bikeshop
spec:
  type: ClusterIP
  selector:
    app: bikeshop-catalogo
  ports:
    - name: http
      port: 9081
      targetPort: 9081

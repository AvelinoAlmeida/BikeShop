server:
  port: 9080

spring:
  application:
    name: bikeshop-gateway
  cloud:
    # A lista de instâncias guardada pelo LoadBalancer dura 5 s (por omissão, 35 s)
    loadbalancer:
      cache:
        ttl: 5s
    gateway:
      server:
        webflux:
          routes:
            # Cada caminho público vai para o serviço com o mesmo nome no Eureka
            - id: catalogo
              uri: lb://bikeshop-catalogo
              predicates:
                - Path=/api/pecas/**,/api/categorias/**
            - id: stock
              uri: lb://bikeshop-stock
              predicates:
                - Path=/api/stock/**
            - id: pagamentos
              uri: lb://bikeshop-pagamentos
              predicates:
                - Path=/api/pagamentos/**
            - id: encomendas
              uri: lb://bikeshop-encomendas
              predicates:
                - Path=/api/encomendas/**
            - id: clientes
              uri: lb://bikeshop-clientes
              predicates:
                - Path=/api/clientes/**
            - id: envios
              uri: lb://bikeshop-envios
              predicates:
                - Path=/api/envios/**
            # Documentação OpenAPI de cada serviço, para a Swagger UI: /api-docs/catalogo -> /v3/api-docs
            - id: docs-catalogo
              uri: lb://bikeshop-catalogo
              predicates:
                - Path=/api-docs/catalogo
              filters:
                - SetPath=/v3/api-docs
            - id: docs-stock
              uri: lb://bikeshop-stock
              predicates:
                - Path=/api-docs/stock
              filters:
                - SetPath=/v3/api-docs
            - id: docs-pagamentos
              uri: lb://bikeshop-pagamentos
              predicates:
                - Path=/api-docs/pagamentos
              filters:
                - SetPath=/v3/api-docs
            - id: docs-encomendas
              uri: lb://bikeshop-encomendas
              predicates:
                - Path=/api-docs/encomendas
              filters:
                - SetPath=/v3/api-docs
            - id: docs-clientes
              uri: lb://bikeshop-clientes
              predicates:
                - Path=/api-docs/clientes
              filters:
                - SetPath=/v3/api-docs
            - id: docs-envios
              uri: lb://bikeshop-envios
              predicates:
                - Path=/api-docs/envios
              filters:
                - SetPath=/v3/api-docs
            # Só leitura, para a página Bastidores: o registo do Eureka...
            - id: registo
              uri: http://${EUREKA_HOST:localhost}:9761
              predicates:
                - Path=/bastidores/registo
                - Method=GET
              filters:
                - SetPath=/eureka/apps
                - SetRequestHeader=Accept, application/json
            # ...e as filas do RabbitMQ (API de gestão, com as credenciais de laboratório)
            - id: filas
              uri: http://${RABBITMQ_HOST:localhost}:${RABBITMQ_ADMIN_PORT:15673}
              predicates:
                - Path=/bastidores/filas
                - Method=GET
              filters:
                - SetPath=/api/queues
                - SetRequestHeader=Authorization, Basic ${RABBITMQ_BASIC:YmlrZXNob3A6YmlrZXNob3A=}

# Swagger UI (http://localhost:9080/swagger-ui.html): um separador por serviço de negócio (6)
springdoc:
  swagger-ui:
    urls-primary-name: catalogo
    urls:
      - name: catalogo
        url: /api-docs/catalogo
      - name: stock
        url: /api-docs/stock
      - name: pagamentos
        url: /api-docs/pagamentos
      - name: encomendas
        url: /api-docs/encomendas
      - name: clientes
        url: /api-docs/clientes
      - name: envios
        url: /api-docs/envios

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:9761/eureka/
    # Quem chama outros serviços vê as instâncias novas ao fim de 5 s (por omissão, 30 s)
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  # Tracing: todos os pedidos são registados e enviados por OTLP para o Jaeger (bikeshop-jaeger)
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://${OTEL_HOST:localhost}:${OTEL_PORT:4319}/v1/traces
  # O Jaeger só recebe traces: as métricas não são exportadas
  otlp:
    metrics:
      export:
        enabled: false
